services:
  - type: web
    name: mojo-whatsapp-agent
    runtime: python
    plan: free
    region: oregon                    # change if you prefer (oregon, frankfurt, singapore, etc.)
    buildCommand: pip install -r requirements.txt
    startCommand: python whatsapp_agent.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"              # or whatever version you use locally
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OWNER_SENDER_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false                  # set the real value in the dashboard after first deploy
      # Add any other secrets the same way